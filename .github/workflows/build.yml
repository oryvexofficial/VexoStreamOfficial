name: Build Windows app

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-app:
    name: Build Flutter app for Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Windows runner if needed
        working-directory: apps
        shell: pwsh
        run: |
          if (!(Test-Path 'windows/CMakeLists.txt')) {
            flutter create --platforms=windows --project-name=vexostream_app --org=bond.vexostream .
          }
      - name: Resolve Flutter packages
        working-directory: apps
        run: flutter pub get
      - name: Run app API contract tests
        working-directory: apps
        run: flutter test test/api_contract_test.dart
      - name: Build release application
        working-directory: apps
        run: flutter build windows --release
      - name: Package Windows release
        working-directory: apps
        shell: pwsh
        run: Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath 'VexoStream-Windows.zip' -Force
      - uses: actions/upload-artifact@v4
        with:
          name: VexoStream-Windows
          path: apps/VexoStream-Windows.zip
          if-no-files-found: error
          retention-days: 30
