name: Build VexoStream apps

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  website:
    name: Build and test website Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install website dependencies
        working-directory: site
        run: npm install --no-audit --no-fund
      - name: Build and run website regression tests
        working-directory: site
        run: npm test

  android:
    name: Flutter Android universal APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_KEY: ${{ secrets.APP_KEY }}
    outputs:
      label: ${{ steps.metadata.outputs.label }}
      tag_name: ${{ steps.metadata.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve app version and artifact label
        id: metadata
        working-directory: apps/flutterapp
        shell: bash
        run: |
          version="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)[+]([0-9]+).*$/\1/p' pubspec.yaml)"
          build_number="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)[+]([0-9]+).*$/\2/p' pubspec.yaml)"
          if [[ -z "$version" || -z "$build_number" ]]; then
            echo "Could not read version from pubspec.yaml" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then tag_name="$GITHUB_REF_NAME"; else tag_name="v$version"; fi
          if [[ -n "$APP_KEY" ]]; then label="api-ready"; else label="validation-no-app-key"; fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"
          echo "TAG_NAME=$tag_name" >> "$GITHUB_ENV"
          echo "ARTIFACT_LABEL=$label" >> "$GITHUB_ENV"
          echo "PRODUCT_VERSION=$version.$build_number" >> "$GITHUB_ENV"
      - name: Disable Android lintVital for CI
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/disable-lint.gradle << 'GRADLE'
          allprojects {
            afterEvaluate {
              tasks.matching { it.name.startsWith("lintVital") || it.name.contains("Lint") }.configureEach {
                enabled = false
              }
            }
          }
          GRADLE
      - name: Generate Android runner
        working-directory: apps/flutterapp
        run: bash tool/prepare_android.sh
      - name: Resolve packages and test
        working-directory: apps/flutterapp
        run: |
          flutter pub get
          flutter test
      - name: Build universal APK
        working-directory: apps/flutterapp
        shell: bash
        run: |
          args=(
            --release
            "--dart-define=APP_VERSION=$APP_VERSION"
            "--dart-define=VEXOSTREAM_GITHUB_REPOSITORY=$GITHUB_REPOSITORY"
          )
          if [[ -n "$APP_KEY" ]]; then args+=("--dart-define=APP_KEY=$APP_KEY"); fi
          flutter build apk "${args[@]}"
          mkdir -p build/distribution
          suffix=""
          if [[ "$ARTIFACT_LABEL" != "api-ready" ]]; then suffix="-$ARTIFACT_LABEL"; fi
          cp build/app/outputs/flutter-apk/app-release.apk \
            "build/distribution/VexoStream-$TAG_NAME-Android-universal$suffix.apk"
          if [[ -n "$APP_KEY" ]]; then
            printf 'API-ready build. Protected API access is configured at build time.\n' > build/distribution/BUILD-INFO.txt
          else
            printf 'VALIDATION BUILD: APP_KEY was not configured. Protected API calls will not work.\n' > build/distribution/BUILD-INFO.txt
            echo '::warning::Validation build only: APP_KEY is missing, so this artifact cannot use the protected API.'
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: VexoStream-Android-universal-${{ steps.metadata.outputs.label }}-${{ steps.metadata.outputs.tag_name }}
          path: apps/flutterapp/build/distribution/*
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Flutter Windows app and NSIS installer
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      APP_KEY: ${{ secrets.APP_KEY }}
    outputs:
      label: ${{ steps.metadata.outputs.label }}
      tag_name: ${{ steps.metadata.outputs.tag_name }}
      app_version: ${{ steps.metadata.outputs.app_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Windows runner
        working-directory: apps/flutterapp
        shell: pwsh
        run: |
          if (!(Test-Path 'windows/CMakeLists.txt')) {
            flutter create --platforms=windows --project-name=vexostream_app --org=bond.vexostream .
          }
      - name: Apply branding and read release metadata
        id: metadata
        working-directory: apps/flutterapp
        shell: pwsh
        run: |
          Copy-Item 'branding/app_icon.ico' 'windows/runner/resources/app_icon.ico' -Force
          if (Test-Path 'test/widget_test.dart') { Remove-Item 'test/widget_test.dart' -Force }
          $main = Get-Content 'windows/runner/main.cpp' -Raw
          $main = $main -replace 'L"vexostream_app"', 'L"VexoStream"'
          $main = $main -replace 'Win32Window::Size size\(\d+, \d+\);', 'Win32Window::Size size(1360, 860);'
          Set-Content 'windows/runner/main.cpp' $main -NoNewline
          $cm = Get-Content 'windows/CMakeLists.txt' -Raw
          $cm = $cm -replace 'set\(BINARY_NAME "[^"]*"\)', 'set(BINARY_NAME "VexoStream")'
          if ($cm -notmatch 'target_compile_definitions\(webview_windows_plugin') {
            $cm += "`r`nif(TARGET webview_windows_plugin)`r`n  target_compile_definitions(webview_windows_plugin PRIVATE _SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS)`r`nendif()`r`n"
          }
          Set-Content 'windows/CMakeLists.txt' $cm -NoNewline
          $match = Select-String -Path 'pubspec.yaml' -Pattern '^version:\s*(\d+\.\d+\.\d+)\+(\d+)\s*$'
          if (!$match) { throw 'Could not read version and build number from pubspec.yaml.' }
          $version = $match.Matches[0].Groups[1].Value
          $buildNumber = $match.Matches[0].Groups[2].Value
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF_NAME } else { "v$version" }
          $label = if ($env:APP_KEY) { 'api-ready' } else { 'validation-no-app-key' }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PRODUCT_VERSION=$version.$buildNumber" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TAG_NAME=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ARTIFACT_LABEL=$label" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "app_version=$version" >> $env:GITHUB_OUTPUT
          "tag_name=$tag" >> $env:GITHUB_OUTPUT
          "label=$label" >> $env:GITHUB_OUTPUT
      - name: Resolve Flutter packages
        working-directory: apps/flutterapp
        run: flutter pub get
      - name: Test Flutter
        working-directory: apps/flutterapp
        run: flutter test
      - name: Build Flutter Windows
        working-directory: apps/flutterapp
        shell: pwsh
        run: |
          $flutterArgs = @(
            'build', 'windows', '--release',
            "--dart-define=APP_VERSION=$env:APP_VERSION",
            "--dart-define=VEXOSTREAM_GITHUB_REPOSITORY=$env:GITHUB_REPOSITORY"
          )
          if ($env:APP_KEY) { $flutterArgs += "--dart-define=APP_KEY=$env:APP_KEY" }
          & flutter @flutterArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!$env:APP_KEY) {
            Write-Host '::warning::Validation build only: APP_KEY is missing, so this artifact cannot use the protected API.'
          }
      - name: Install NSIS
        run: choco install nsis --yes --no-progress
      - name: Build portable ZIP and NSIS installer
        working-directory: apps/flutterapp
        shell: pwsh
        run: |
          $tag = $env:TAG_NAME
          $suffix = if ($env:ARTIFACT_LABEL -eq 'api-ready') { '' } else { "-$env:ARTIFACT_LABEL" }
          $dist = Join-Path $PWD 'build/distribution'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Get-ChildItem 'installer/VexoStream-*-Setup.exe' -ErrorAction SilentlyContinue | Remove-Item -Force
          Compress-Archive -Path 'build/windows/x64/runner/Release/*' `
            -DestinationPath (Join-Path $dist "VexoStream-$tag-Windows-portable$suffix.zip") -Force
          $makensis = Get-Command makensis.exe -ErrorAction SilentlyContinue
          if ($makensis) {
            $makensisPath = $makensis.Source
          } else {
            $makensisPath = 'C:\Program Files (x86)\NSIS\makensis.exe'
          }
          if (!(Test-Path $makensisPath)) { throw "NSIS compiler not found at $makensisPath" }
          & $makensisPath "/DPRODUCT_VERSION=$env:PRODUCT_VERSION" 'installer\VexoStream.nsi'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = Get-ChildItem 'installer/VexoStream-*-Setup.exe' | Select-Object -First 1
          if (!$installer) { throw 'NSIS completed without producing the expected installer beside its script.' }
          Copy-Item $installer.FullName (Join-Path $dist "VexoStream-$tag-Windows-Setup$suffix.exe") -Force
          if ($env:APP_KEY) {
            'API-ready build. Protected API access is configured at build time.' |
              Set-Content (Join-Path $dist 'BUILD-INFO.txt')
          } else {
            'VALIDATION BUILD: APP_KEY was not configured. Protected API calls will not work.' |
              Set-Content (Join-Path $dist 'BUILD-INFO.txt')
          }
      - name: Upload NSIS installer separately
        uses: actions/upload-artifact@v4
        with:
          name: VexoStream-Windows-NSIS-${{ steps.metadata.outputs.label }}-${{ steps.metadata.outputs.tag_name }}
          path: apps/flutterapp/installer/VexoStream-*-Setup.exe
          if-no-files-found: error
          retention-days: 30
      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: VexoStream-Windows-bundle-${{ steps.metadata.outputs.label }}-${{ steps.metadata.outputs.tag_name }}
          path: apps/flutterapp/build/distribution/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: >-
      github.event_name == 'push' &&
      (
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/master' ||
        startsWith(github.ref, 'refs/tags/v')
      )
    needs: [website, android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      APP_KEY: ${{ secrets.APP_KEY }}
      RELEASE_TAG: ${{ needs.windows.outputs.tag_name }}
    steps:
      - name: Validate tag matches the app version
        env:
          APP_VERSION: ${{ needs.windows.outputs.app_version }}
        shell: bash
        run: |
          tag_version="${RELEASE_TAG#v}"
          tag_base="${tag_version%%-*}"
          if [[ "$tag_base" != "$APP_VERSION" ]]; then
            echo "Release tag $RELEASE_TAG does not match app version $APP_VERSION in pubspec.yaml." >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Stable release tag must use a version such as v1.0.0, with no pre-release suffix." >&2
            exit 1
          fi
      - name: Verify automatic release tag is safe
        id: tag_check
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          ref_url="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG"
          response_file="$(mktemp)"
          status="$(curl -sS -o "$response_file" -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "$ref_url")"
          if [[ "$status" == "404" ]]; then
            echo "Tag $RELEASE_TAG is new; it will be created with this release."
            exit 0
          fi
          if [[ "$status" != "200" ]]; then
            cat "$response_file" >&2
            echo "Could not verify whether tag $RELEASE_TAG already exists (HTTP $status)." >&2
            exit 1
          fi
          object_type="$(jq -r '.object.type' "$response_file")"
          object_sha="$(jq -r '.object.sha' "$response_file")"
          while [[ "$object_type" == "tag" ]]; do
            tag_object="$(curl -fsS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/tags/$object_sha")"
            object_type="$(jq -r '.object.type' <<< "$tag_object")"
            object_sha="$(jq -r '.object.sha' <<< "$tag_object")"
          done
          if [[ "$object_type" != "commit" || "$object_sha" != "$GITHUB_SHA" ]]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping release: tag $RELEASE_TAG already points to a different commit. Bump the app version in apps/flutterapp/pubspec.yaml to publish another release."
            exit 0
          fi
          echo "Tag $RELEASE_TAG already points to this commit; safe to retry the release."
      - uses: actions/download-artifact@v4
        if: github.ref_type == 'tag' || steps.tag_check.outputs.should_release == 'true'
        with:
          pattern: VexoStream-*-${{ needs.windows.outputs.label }}-${{ needs.windows.outputs.tag_name }}
          path: release-input
          merge-multiple: false
      - name: Prepare release assets
        if: github.ref_type == 'tag' || steps.tag_check.outputs.should_release == 'true'
        env:
          BUILD_LABEL: ${{ needs.windows.outputs.label }}
        shell: bash
        run: |
          mkdir -p release-assets
          suffix=""
          if [[ "$BUILD_LABEL" != "api-ready" ]]; then suffix="-$BUILD_LABEL"; fi
          tag="$RELEASE_TAG"
          copy_first() {
            local name="$1"
            local destination="$2"
            local source
            source="$(find release-input -type f -name "$name" -print -quit)"
            if [[ -z "$source" ]]; then
              echo "Required release asset not found: $name" >&2
              exit 1
            fi
            cp "$source" "release-assets/$destination"
          }
          copy_first "VexoStream-$tag-Windows-Setup$suffix.exe" "VexoStream-$tag-Windows-Setup$suffix.exe"
          copy_first "VexoStream-$tag-Windows-portable$suffix.zip" "VexoStream-$tag-Windows-portable$suffix.zip"
          copy_first "VexoStream-$tag-Android-universal$suffix.apk" "VexoStream-$tag-Android-universal$suffix.apk"
          if [[ "$BUILD_LABEL" != "api-ready" ]]; then
            printf '%s\n' \
              'VALIDATION BUILD: APP_KEY was not configured.' \
              'The protected VexoStream API cannot be used by these binaries.' \
              > "release-assets/VexoStream-$tag-VALIDATION-NO-APP_KEY.txt"
          fi
      - name: Publish release
        if: github.ref_type == 'tag' || steps.tag_check.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.windows.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: VexoStream ${{ needs.windows.outputs.tag_name }}
          body: |
            VexoStream ${{ needs.windows.outputs.tag_name }} release.
            ${{ env.APP_KEY == '' && 'VALIDATION BUILD: APP_KEY is missing. Protected API calls will not work. Add the APP_KEY repository secret and publish a new app version for API-ready builds.' || 'API-ready build. Windows installer, portable ZIP, and universal Android APK are attached.' }}
          files: release-assets/*
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
