name: Build Windows app

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-app:
    name: Build Flutter app for Windows
    runs-on: windows-latest
    env:
      APP_KEY: ${{ secrets.APP_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Windows runner if needed
        working-directory: apps
        shell: pwsh
        run: |
          if (!(Test-Path 'windows/CMakeLists.txt')) {
            flutter create --platforms=windows --project-name=vexostream_app --org=bond.vexostream .
          }
      - name: Apply VexoStream branding (icon, window title, exe name)
        working-directory: apps
        shell: pwsh
        run: |
          Copy-Item 'branding/app_icon.ico' 'windows/runner/resources/app_icon.ico' -Force
          if (Test-Path 'test/widget_test.dart') { Remove-Item 'test/widget_test.dart' -Force }
          $main = Get-Content 'windows/runner/main.cpp' -Raw
          $main = $main -replace 'L"vexostream_app"', 'L"VexoStream"'
          $main = $main -replace 'Win32Window::Size size\(\d+, \d+\);', 'Win32Window::Size size(1360, 860);'
          Set-Content 'windows/runner/main.cpp' $main -NoNewline
          $rc = Get-Content 'windows/runner/Runner.rc' -Raw
          $rc = $rc -replace '"CompanyName", "[^"]*"', '"CompanyName", "VexoStream"'
          $rc = $rc -replace '"FileDescription", "[^"]*"', '"FileDescription", "VexoStream"'
          $rc = $rc -replace '"InternalName", "[^"]*"', '"InternalName", "VexoStream"'
          $rc = $rc -replace '"OriginalFilename", "[^"]*"', '"OriginalFilename", "VexoStream.exe"'
          $rc = $rc -replace '"ProductName", "[^"]*"', '"ProductName", "VexoStream"'
          $rc = $rc -replace '"LegalCopyright", "[^"]*"', '"LegalCopyright", "Copyright (C) 2026 VexoStream"'
          Set-Content 'windows/runner/Runner.rc' $rc -NoNewline
          $cm = Get-Content 'windows/CMakeLists.txt' -Raw
          $cm = $cm -replace 'set\(BINARY_NAME "[^"]*"\)', 'set(BINARY_NAME "VexoStream")'
          Set-Content 'windows/CMakeLists.txt' $cm -NoNewline
          Select-String -Path 'windows/CMakeLists.txt' -Pattern 'BINARY_NAME "VexoStream"' | Out-Host
      - name: Resolve Flutter packages
        working-directory: apps
        run: flutter pub get
      - name: Run app API contract tests
        working-directory: apps
        run: flutter test test/api_contract_test.dart
      - name: Build release application
        if: env.APP_KEY != ''
        working-directory: apps
        shell: pwsh
        run: flutter build windows --release --dart-define=APP_KEY=$env:APP_KEY
      - name: Skip release build when APP_KEY is not configured
        if: env.APP_KEY == ''
        run: echo '::warning::Set the APP_KEY repository secret to build a usable Windows release.'
      - name: Package Windows release
        if: env.APP_KEY != ''
        working-directory: apps
        shell: pwsh
        run: Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath 'VexoStream-Windows.zip' -Force
      - uses: actions/upload-artifact@v4
        if: env.APP_KEY != ''
        with:
          name: VexoStream-Windows
          path: apps/VexoStream-Windows.zip
          if-no-files-found: error
          retention-days: 30
