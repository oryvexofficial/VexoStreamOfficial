[package]
name = "vexostreamapp_rust"
version = "0.2.0"
edition = "2021"
publish = false

[dependencies]
eframe = "0.27"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
base64 = "0.22"
url = "2"
image = { version = "0.24", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
